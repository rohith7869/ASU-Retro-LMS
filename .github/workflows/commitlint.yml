name: Commitlint

on:
  pull_request:
    branches: [ master ]
  push:
    branches-ignore:
      - master

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run commitlint on commits
        uses: wagoid/commitlint-github-action@v6
